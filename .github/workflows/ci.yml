
name: DNS Tunneling Detector CI

on:
  push:
    branches:
      - lab3-github-actions
  pull_request:
    branches:
      - lab3-github-actions

permissions:
  contents: read

concurrency:
  group: dns-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/junit.xml
          if-no-files-found: ignore

  code_quality:
    name: Ruff and Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install ruff==0.14.4 bandit==1.9.4

      - name: Ruff
        run: ruff check src tests

      - name: Bandit
        run: bandit -r src -ll

  data_quality:
    name: Dataset quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements-dev.txt

      - name: Validate dataset
        run: python src/data_quality_gate.py

  model_quality:
    name: Model quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements-dev.txt

      - name: Evaluate ONNX model
        run: python src/model_quality_gate.py

      - name: Upload model gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-report
          path: metrics/model_gate_result.json
          if-no-files-found: ignore

  dependency_audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pip-audit==2.10.1

      - name: Run pip-audit
        run: |
          mkdir -p reports
          pip-audit -r requirements-dev.txt \
            --format json \
            --output reports/pip-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          if-no-files-found: ignore

  trivy_config:
    name: Trivy configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config
        uses: aquasecurity/trivy-action@v0.33.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-config.json

      - name: Upload config report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.json
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dns-tunneling-detector:ci .

      - name: Run smoke test
        run: docker run --rm dns-tunneling-detector:ci

      - name: Verify non-root user
        run: |
          USER_ID=$(docker run --rm \
            --entrypoint id dns-tunneling-detector:ci -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" -ne 0

      - name: Save image
        run: docker save dns-tunneling-detector:ci -o image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 3

  trivy_image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.33.0
        with:
          input: image.tar
          scan-type: image
          severity: CRITICAL
          exit-code: "1"
          format: json
          output: trivy-image.json

      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          if-no-files-found: ignore
