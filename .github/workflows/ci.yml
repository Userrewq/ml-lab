name: DNS Tunneling Detector CI

on:
  push:
    branches:
      - lab3-*
      - lab4-*   # [ЛР4] Добавлена ветка для ЛР4
  pull_request:
    branches:
      - lab3-*
      - lab4-*

permissions:
  contents: read

concurrency:
  group: dns-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Ruff and Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install tools
        run: pip install ruff==0.14.4 bandit==1.9.4

      - name: Ruff
        run: ruff check src tests

      - name: Bandit
        run: bandit -r src -ll

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/junit.xml
          if-no-files-found: ignore

  # [ЛР4] НОВЫЙ JOB: API-тесты запускаются параллельно с основными
  api_tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run API tests
        run: |
          mkdir -p reports
          pytest tests/test_api.py -q --junitxml=reports/api-junit.xml

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-junit.xml
          if-no-files-found: ignore

  dependency_audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    needs: [tests, api_tests]   # [ЛР4] Зависит от обоих типов тестов
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Run pip-audit
        run: |
          mkdir -p reports
          pip-audit -r requirements-dev.txt \
            --format json \
            --output reports/pip-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          if-no-files-found: ignore

  data_quality:
    name: Dataset quality gate
    runs-on: ubuntu-latest
    needs: dependency_audit
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate dataset
        run: python src/data_quality_gate.py

  model_quality:
    name: Model quality gate
    runs-on: ubuntu-latest
    needs: data_quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Evaluate ONNX model
        run: python src/model_quality_gate.py

      - name: Upload model gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-report
          path: metrics/model_gate_result.json
          if-no-files-found: ignore

  trivy_config:
    name: Trivy configuration scan
    runs-on: ubuntu-latest
    needs: model_quality
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-config.json

      - name: Upload config report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.json
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: trivy_config
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dns-tunneling-detector:ci .

      # [ЛР4] ОБНОВЛЁН: Smoke test для FastAPI-приложения
      - name: Run API smoke test
        run: |
          # Запуск контейнера в фоне с тестовым токеном
          docker run -d --name api-smoke \
            -p 8000:8000 \
            -e API_TOKEN=smoke-test-token \
            dns-tunneling-detector:ci

          # Ожидание запуска uvicorn и загрузки модели
          sleep 8

          # Проверка health endpoint
          curl -sf http://localhost:8000/health || {
            echo "Health check failed. Container logs:"
            docker logs api-smoke
            docker stop api-smoke && docker rm api-smoke
            exit 1
          }

          # Очистка
          docker stop api-smoke && docker rm api-smoke

      - name: Verify non-root user
        run: |
          USER_ID=$(docker run --rm \
            --entrypoint id dns-tunneling-detector:ci -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" -ne 0

      - name: Save image
        run: docker save dns-tunneling-detector:ci -o image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 3

  trivy_image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          input: image.tar
          scan-type: image
          severity: CRITICAL
          exit-code: "1"
          format: json
          output: trivy-image.json

      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          if-no-files-found: ignore
