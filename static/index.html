<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNS Tunneling Detection</title>
    <style>
        body {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #20242a;
        }
        main {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #0001;
        }
        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }
        input, textarea, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            font: inherit;
        }
        textarea {
            min-height: 220px;
            font-family: monospace;
        }
        button {
            margin-top: 16px;
            cursor: pointer;
            background: #2457a7;
            color: white;
            border: 0;
            border-radius: 5px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        pre {
            padding: 14px;
            background: #f0f2f5;
            border-radius: 5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        #status {
            margin-top: 16px;
        }
    </style>
</head>
<body>
<main>
    <h1>DNS Tunneling Detection</h1>
    <p>Сервис классификации сетевых признаков с помощью ONNX-модели.</p>

    <form id="predict-form">
        <label for="api-token">API token</label>
        <input
            id="api-token"
            type="password"
            autocomplete="off"
            required
            placeholder="Введите API token"
        >

        <label for="payload">Данные для предсказания (JSON)</label>
        <textarea id="payload" required spellcheck="false">{
  "rows": [
    {
      "src_port": 53,
      "dst_port": 443,
      "duration": 1.0,
      "total_bytes": 100,
      "receiving_bytes": 50,
      "sending_bytes": 50,
      "packets_rate": 2.0,
      "packets_len_rate": 100.0,
      "min_packets_len": 20,
      "max_packets_len": 80,
      "mean_packets_len": 50.0,
      "standard_deviation_packets_len": 10.0,
      "variance_packets_len": 100.0,
      "coefficient_of_variation_packets_len": 0.2,
      "dns_domain_name_length": 20,
      "dns_subdomain_name_length": 10,
      "numerical_percentage": 0.1,
      "character_entropy": 2.5,
      "max_continuous_numeric_len": 2,
      "max_continuous_alphabet_len": 5,
      "max_continuous_consonants_len": 3,
      "max_continuous_same_alphabet_len": 2,
      "vowels_consonant_ratio": 0.5,
      "conv_freq_vowels_consonants": 0.4,
      "distinct_ttl_values": 1,
      "ttl_values_min": 64,
      "ttl_values_max": 64,
      "ttl_values_mean": 64.0,
      "ttl_values_mode": 64,
      "ttl_values_median": 64,
      "distinct_A_records": 1
    }
  ]
}</textarea>

        <button id="submit-button" type="submit">Выполнить предсказание</button>
    </form>

    <p id="status" role="status"></p>
    <h2>Результат</h2>
    <pre id="result">Ожидание запроса.</pre>
</main>

<script>
    const form = document.getElementById("predict-form");
    const tokenInput = document.getElementById("api-token");
    const payloadInput = document.getElementById("payload");
    const submitButton = document.getElementById("submit-button");
    const statusOutput = document.getElementById("status");
    const resultOutput = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        submitButton.disabled = true;
        statusOutput.textContent = "Запрос выполняется...";
        resultOutput.textContent = "";

        try {
            const payload = JSON.parse(payloadInput.value);

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-API-Token": tokenInput.value
                },
                body: JSON.stringify(payload)
            });

            const responseText = await response.text();
            let responseData;

            try {
                responseData = JSON.parse(responseText);
            } catch {
                responseData = { detail: "Сервер вернул некорректный ответ." };
            }

            if (!response.ok) {
                statusOutput.textContent = `Ошибка HTTP ${response.status}`;
                resultOutput.textContent =
                    responseData.detail || "Запрос отклонён сервером.";
                return;
            }

            statusOutput.textContent = "Предсказание успешно выполнено.";
            resultOutput.textContent = JSON.stringify(responseData, null, 2);
        } catch (error) {
            statusOutput.textContent = "Не удалось выполнить запрос.";
            resultOutput.textContent =
                error instanceof SyntaxError
                    ? "Проверьте синтаксис JSON."
                    : "Ошибка соединения с сервисом.";
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
